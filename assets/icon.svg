<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- T3 Glasses: the G2 display panel (Even Terminal style) around "T3". -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#3CFA44" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3CFA44" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="#0A0A0A"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- Display panel -->
  <rect x="148" y="252" width="728" height="520" rx="64" fill="none" stroke="#3CFA44" stroke-width="30"/>
  <!-- Header rule -->
  <line x1="214" y1="356" x2="810" y2="356" stroke="#3CFA44" stroke-opacity="0.45" stroke-width="12" stroke-linecap="round"/>
  <!-- T3 -->
  <text x="512" y="602" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="250" letter-spacing="-8" fill="#3CFA44">T3</text>
  <!-- Footer rule and status -->
  <line x1="214" y1="668" x2="810" y2="668" stroke="#3CFA44" stroke-opacity="0.45" stroke-width="12" stroke-linecap="round"/>
  <circle cx="238" cy="716" r="16" fill="#3CFA44"/>
  <rect x="276" y="706" width="196" height="20" rx="10" fill="#3CFA44" fill-opacity="0.75"/>
  <rect x="652" y="706" width="134" height="20" rx="10" fill="#3CFA44" fill-opacity="0.4"/>
</svg>
